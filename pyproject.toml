[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arisekit"
version = "0.13.22"
description = "Open-source framework for authoring and running MAST-compatible medical AI benchmarks."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ARISE Network" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "litellm>=1.104.2,<2",
    # Security floors for existing LiteLLM dependencies also apply to unlocked installs.
    "certifi>=2026.10.18",
    "filelock>=4.2.1",
    "pyyaml>=6.0",
    "packaging>=23.2",
]

[project.optional-dependencies]
autonomous = ["scipy>=1.11", "google-genai>=1.0,<2", "pyasn1>=0.6.5", "jsonschema>=4,<5", "Pillow>=13,<14", "numpy>=1.26,<3"]
hf = ["datasets>=2.16.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
arisekit = "arisekit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["arisekit", "benchmarks/noharm_reference"]

[tool.hatch.build.targets.sdist]
include = [
    "/arisekit",
    "/benchmarks/noharm_reference",
    "/LICENSE",
    "/README.md",
    "/VERSION",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "study: validates a committed research-study artifact or protocol binding",
    "slow: unsuitable for the fast pull-request feedback loop",
    "live: makes an explicitly authorized network or paid model call",
]
